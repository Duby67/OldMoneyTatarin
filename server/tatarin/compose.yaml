services:
  source:
    image: caddy:2.9
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    # The upstream Caddy executable carries this file capability.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    ports:
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./public:/srv:ro
      - ./certificates:/certificates:ro
    tmpfs:
      - /tmp
      - /config
      - /data
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
