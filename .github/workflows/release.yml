name: Release metadata

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, closed]

permissions:
  contents: read

jobs:
  validate:
    name: release-validation
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate source branch, version and changelog
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$HEAD_REPO" = "$GITHUB_REPOSITORY"
          test "$HEAD_BRANCH" = develop
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA="$(git rev-parse origin/main)"
          fi
          python3 scripts/prepare_release.py --tag "$(cat VERSION)" --base-ref "$BASE_SHA"
          python3 -m unittest discover -s tests/release -p '*_test.py'

  publish:
    name: publish-release-metadata
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Publish tag and text release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_release.py
